<text x="726" y="568" text-anchor="middle" font-size="20" fill="#647184">사용자 연결 · 요청 처리</text>
<text x="726" y="614" text-anchor="middle" font-size="19" fill="#2a65b7">Node.js · HTTP / WebSocket</text>
<text x="1176" y="529" text-anchor="middle" font-size="29" font-weight="650">데이터 저장</text>
<text x="1176" y="568" text-anchor="middle" font-size="20" fill="#647184">방명록 · 피드백 · 방문 통계</text>
