<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">3NU — 탐험, 연결, 기록</title><desc id="desc">브라우저에서 3D 캠퍼스를 탐험합니다. Node.js 서버가 HTTP 요청과 WebSocket 실시간 연결을 처리하고 SQLite에 방명록, 피드백, 방문 통계를 저장합니다. 서버와 데이터베이스는 하나의 서버에서 운영합니다. 현재 비공개 운영 기준입니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto-start-reverse"><path d="M2 2 L8 5 L2 8" fill="none" stroke="#8592a2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1440" height="800" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Noto Sans KR,sans-serif" fill="#202b3a">
<text x="64" y="88" font-size="46" font-weight="700">3NU</text><text x="178" y="88" font-size="34" font-weight="500">시스템 구조</text>
<text x="66" y="130" font-size="22" fill="#758091">브라우저의 3D 화면을 서버와 연결하고, 기록을 저장합니다.</text>
<!-- Shared deployment boundary: server and SQLite are not separate servers. -->
<rect x="525" y="192" width="851" height="493" rx="28" fill="#f6f8fb"/>
<text x="950" y="230" text-anchor="middle" font-size="18" fill="#758091">하나의 서버에서 운영</text>
