<text x="64" y="747" font-size="17" fill="#7d8795">BUILD113 · 비공개 운영 기준</text>
<text x="1376" y="747" text-anchor="end" font-size="17" fill="#7d8795">실시간 플레이어 상태는 서버 메모리에서 관리</text>
