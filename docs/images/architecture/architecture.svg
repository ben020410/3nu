<circle cx="330" cy="410" r="12" fill="#a6bea0"/><path d="M330 419 V431" stroke="#899a84" stroke-width="3"/>
<circle cx="134" cy="431" r="8" fill="#a6bea0"/>
</g>
<!-- Server icon: one application, with compact connection glyph -->
