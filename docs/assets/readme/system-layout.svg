<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">클라이언트와 서버의 역할</title><desc id="desc">브라우저는 Babylon.js로 캠퍼스를 렌더링하고 카메라, 지도, 길안내, NPC를 관리합니다. WebSocket으로 위치와 동작을 보내고 공유 상태를 받습니다. Node.js 서버는 플레이어 식별, 좌석 점유, 셔틀 시각과 입력 검증을 관리합니다.</desc>
<rect width="1200" height="350" rx="18" fill="#f0f4f8"/><rect x="30" y="30" width="405" height="290" rx="12" fill="#fff"/><rect x="765" y="30" width="405" height="290" rx="12" fill="#15234a"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo',sans-serif">
<text x="58" y="77" fill="#15234a" font-size="29" font-weight="750">브라우저</text><text x="58" y="111" fill="#54657c" font-size="22">JavaScript · Babylon.js</text><path d="M58 135H407" stroke="#dbe2ec"/>
<g fill="#30435c" font-size="24"><text x="58" y="176">캠퍼스 3D 렌더링</text><text x="58" y="219">카메라 · 지도 · 길안내</text><text x="58" y="262">개인 설정 · 로컬 NPC</text></g>
<text x="793" y="77" fill="#fff" font-size="29" font-weight="750">캠퍼스 서버</text><text x="793" y="111" fill="#b7c8e3" font-size="22">Node.js · ws</text><path d="M793 135H1142" stroke="#455372"/>
<g fill="#edf2fa" font-size="24"><text x="793" y="176">플레이어 식별 · 상태</text><text x="793" y="219">좌석 점유 · 셔틀 시각</text><text x="793" y="262">입력 검증 · 재접속</text></g>
<g text-anchor="middle"><text x="600" y="91" fill="#176d99" font-size="25" font-weight="700">WebSocket</text><text x="600" y="160" fill="#405573" font-size="22">위치 · 동작</text><text x="600" y="268" fill="#405573" font-size="22">공유 상태</text></g>
