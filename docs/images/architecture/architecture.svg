<text x="240" y="568" text-anchor="middle" font-size="20" fill="#647184">3D 캠퍼스 · 이동 · 상호작용</text>
<text x="240" y="614" text-anchor="middle" font-size="19" fill="#2a65b7">JavaScript · Babylon.js</text>
