<rect x="550" y="253" width="352" height="409" rx="22" fill="#fff" stroke="#dce2ea" stroke-width="1.5"/>
<rect x="1000" y="253" width="352" height="409" rx="22" fill="#fff" stroke="#dce2ea" stroke-width="1.5"/>
